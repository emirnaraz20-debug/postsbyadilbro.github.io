<!doctype html>
<html lang="bn">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#f7f7f4"><meta name="description" content="Posts by Adil">
  <title>Posts by Adil</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Noto+Serif+Bengali:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.2.6/purify.min.js" defer></script>
</head>
<body>
  
  <header class="site-header">
    <a class="brand" href="index.html"><span>Posts by Adil</span></a>
    <nav class="main-nav"><a class="active" href="index.html">হোম</a><a href="#latest">পোস্ট</a><a href="#categories">ক্যাটাগরি</a></nav>
    <div class="header-actions"><button class="icon-button" id="themeToggle" aria-label="থিম পরিবর্তন" title="থিম পরিবর্তন">◐</button><button class="menu-toggle" id="menuToggle" aria-label="মেনু">☰</button></div>
  </header>

  <main>
    <section class="hero container">
      <div class="hero-copy"><p class="eyebrow"><span class="eyebrow-rule"></span> POSTS BY ADIL</p>
        <h1>Posts by <em>Adil.</em></h1>
        <p class="hero-description">লেখা, ছবি ও ভিডিও।</p>
        <a class="text-link" href="#latest">সব পোস্ট দেখুন <span>↘</span></a>
      </div>
    </section>


    <section class="container content-section" id="latest">
      <div class="section-top"><div><p class="eyebrow">FEATURED</p><h2>পিন করা পোস্ট<span class="accent-dot">.</span></h2></div></div>
      <div id="featuredPost" class="featured-slot"><div class="skeleton feature-skeleton"></div></div>
    </section>

    <section class="container content-section latest-section">
      <div class="section-top"><div><p class="eyebrow">ALL POSTS</p><h2>সব পোস্ট<span class="accent-dot">.</span></h2></div>
        <div class="list-controls"><label class="search-box"><span>⌕</span><input id="searchInput" type="search" placeholder="লেখা খুঁজুন..." aria-label="লেখা খুঁজুন"></label><select id="sortSelect" aria-label="লেখা সাজান"><option value="newest">নতুন আগে</option><option value="oldest">পুরনো আগে</option><option value="manual">ম্যানুয়াল অর্ডার</option><option value="pinned">শুধু পিন করা</option></select></div>
      </div>
      <div id="categories" class="category-filters"><button class="filter-chip active" data-filter="">সব বিষয় <span id="allCount">০</span></button><div id="categoryChips"></div></div>
      <div id="postGrid" class="post-grid"><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div></div>
      <div id="emptyState" class="empty-state hidden"><span class="empty-symbol">অ</span><h3>এখানে এখনো কোনো লেখা নেই</h3><p>নতুন লেখা প্রকাশিত হলে এখানে দেখা যাবে।</p></div>
      <div class="load-more-wrap"><button id="loadMore" class="outline-button hidden">আরও লেখা দেখুন <span>↓</span></button></div>
    </section>


    <section class="container category-footer"><div><p class="eyebrow">CATEGORIES</p><h2>ক্যাটাগরি</h2></div><div id="footerCategories" class="footer-category-list"><span class="muted">ক্যাটাগরি লোড হচ্ছে...</span></div></section>
  </main>
  <footer class="site-footer"><div class="container footer-inner"><a class="brand footer-brand" href="index.html"><span>Posts by Adil</span></a><span>© <span id="year"></span> Posts by Adil</span></div></footer>
  <script type="module" src="js/app.js"></script>
</body></html>
